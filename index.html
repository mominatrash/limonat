<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ليمونات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10131c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ليمونات">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --lemon: #ffd43b; --lemon-2: #ffe680; --lemon-deep: #e0a800; --lemon-edge: #b98300;
    --leaf: #2f9e5b; --leaf-deep: #1b6b3c;
    --ink: #10131c; --ink-2: #1a1f2e;
    --glass: rgba(18, 22, 36, 0.58); --glass-2: rgba(255, 255, 255, 0.08); --edge: rgba(255, 255, 255, 0.16);
    --text: #ffffff; --muted: rgba(255, 255, 255, 0.72);
    --danger: #ff5a4f; --sky: #7fd3ff;
    --font: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, system-ui, sans-serif;
    --r: 22px;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { width: 100%; height: 100%; margin: 0; background: #0d1020; overflow: hidden; overscroll-behavior: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { font-family: var(--font); color: var(--text); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #game canvas { display: block; width: 100%; height: 100%; }
  svg { display: block; }
  button { font-family: inherit; }

  /* ---------------- shared ---------------- */
  .glass { background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: var(--shadow); }
  .btn {
    --bg: linear-gradient(180deg, #ffffff22, #ffffff10); --edge-c: rgba(0,0,0,.35); --fg: var(--text);
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font-weight: 700; font-size: 20px; line-height: 1; color: var(--fg); cursor: pointer;
    padding: 14px 22px 16px; min-height: 54px; border-radius: 18px;
    border: 1px solid var(--edge); background: var(--bg);
    box-shadow: 0 5px 0 var(--edge-c), 0 10px 24px rgba(0,0,0,.25);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .12s ease, box-shadow .12s ease, filter .15s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge-c), 0 4px 12px rgba(0,0,0,.25); }
  .btn:focus-visible { outline: 3px solid var(--lemon); outline-offset: 3px; }
  .btn svg { width: 24px; height: 24px; flex: none; }
  .btn.primary {
    --bg: linear-gradient(180deg, var(--lemon-2) 0%, var(--lemon) 45%, var(--lemon-deep) 100%);
    --edge-c: var(--lemon-edge); --fg: #3a2a00;
    border-color: rgba(255,255,255,.55); font-size: 30px; font-weight: 800; padding: 16px 44px 18px; min-height: 68px; border-radius: 24px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .btn.primary::after { content: ''; position: absolute; inset: 3px 10px auto; height: 40%; border-radius: 20px 20px 50% 50%; background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0)); pointer-events: none; }
  .btn.green { --bg: linear-gradient(180deg, #4fd07e, var(--leaf)); --edge-c: var(--leaf-deep); }
  .btn.icon { width: 52px; min-width: 52px; height: 52px; min-height: 52px; padding: 0; border-radius: 16px; }
  .btn.small { font-size: 16px; min-height: 42px; padding: 8px 14px 10px; border-radius: 14px; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .pulse:hover, .pulse:active { animation: none; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; direction: ltr; }
  .chip svg { width: 24px; height: 24px; }
  .chip .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
  .coin { width: 22px; height: 22px; }

  /* ---------------- screens ---------------- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); }
  .screen.dim { background: radial-gradient(ellipse at center, rgba(10,12,24,.45), rgba(10,12,24,.8)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .rise { animation: rise .5s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }

  /* logo */
  .logo { display: flex; flex-direction: column; align-items: center; gap: 0; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  .logo-row { display: flex; align-items: center; gap: 10px; direction: rtl; }
  .logo-word { font-weight: 800; font-size: clamp(56px, 13vw, 118px); line-height: 1.05; color: var(--lemon);
    background: linear-gradient(180deg, #fff6c2 0%, var(--lemon) 40%, #f2b600 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2px rgba(80, 50, 0, .25); paint-order: stroke fill; }
  .logo-lemon { width: clamp(54px, 11vw, 100px); height: auto; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
  .tagline { margin-top: -4px; font-size: clamp(14px, 3.4vw, 20px); font-weight: 600; letter-spacing: .02em; color: #fff; background: rgba(20,24,40,.45); padding: 4px 16px; border-radius: 999px; border: 1px solid var(--edge); }

  #loading { background: radial-gradient(ellipse at 50% 35%, #26304d, #0d1020 70%); }
  .loadbar { width: min(300px, 70vw); height: 12px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; border: 1px solid var(--edge); }
  .loadbar div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--lemon-deep), var(--lemon), #fff6c2); border-radius: 999px; transition: width .3s; }
  .hint { font-size: 14px; color: var(--muted); text-align: center; max-width: 40em; }
  .hint kbd { font-family: inherit; font-weight: 700; color: #fff; background: rgba(255,255,255,.12); border: 1px solid var(--edge); border-bottom-width: 3px; padding: 0 7px; border-radius: 7px; margin: 0 2px; direction: ltr; display: inline-block; }

  /* menu */
  #menu { justify-content: space-between; background: linear-gradient(180deg, rgba(8,10,20,.45) 0%, rgba(8,10,20,0) 26%, rgba(8,10,20,0) 58%, rgba(8,10,20,.6) 100%); }
  .topbar { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .topbar .group { display: flex; gap: 8px; align-items: center; }
  .menu-bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .menu-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .menu-modes { display: flex; gap: 10px; justify-content: center; width: min(460px, 100%); }
  .menu-modes .btn { flex: 1; font-size: 18px; min-height: 50px; padding: 10px 14px; }
  .menu-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(460px, 100%); }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 9px 2px 8px; border-radius: 16px; border: 1px solid var(--edge);
    background: var(--glass); color: var(--text); font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 0 rgba(0,0,0,.3); transition: transform .12s; white-space: nowrap; }
  .tile:hover { transform: translateY(-2px); } .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .tile:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
  .tile svg { width: 26px; height: 26px; }
  .tile .dot { position: absolute; top: 6px; inset-inline-end: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px rgba(0,0,0,.4); }
  @media (max-width: 380px) { .tile span { font-size: 11px; } .tile svg { width: 22px; height: 22px; } }
  @media (max-height: 560px) { .menu-modes .btn { min-height: 44px; font-size: 16px; } .tile { padding: 6px 2px; } .tile svg { width: 22px; height: 22px; } #menu .hint { display: none; } }
  .menu-top { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  /* the hero is framed in the space the menu leaves free (see Game.menuFrame) */
  .menu-main { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 0; }
  @media (max-aspect-ratio: 115/100) {
    .menu-main { padding-top: 2vh; }
    #menu { background: linear-gradient(180deg, rgba(8,10,20,.5) 0%, rgba(8,10,20,0) 24%, rgba(8,10,20,0) 64%, rgba(8,10,20,.62) 100%); }
  }
  @media (min-aspect-ratio: 115/100) {
    .menu-main { align-self: flex-start; width: min(50%, 560px); justify-content: center; gap: clamp(12px, 5vh, 44px); }
    .logo-word { font-size: clamp(48px, min(9vw, 17vh), 118px); }
    .logo-lemon { width: clamp(44px, min(8vw, 15vh), 100px); }
    #menu { background: linear-gradient(var(--menu-side, 270deg), rgba(8,10,20,.55) 0%, rgba(8,10,20,.2) 42%, rgba(8,10,20,0) 60%); }
    [dir="ltr"] #menu { --menu-side: 90deg; }
  }

  /* character select */
  #character { justify-content: space-between; background: linear-gradient(180deg, rgba(8,10,20,.5), rgba(8,10,20,0) 22%, rgba(8,10,20,0) 55%, rgba(8,10,20,.65)); }
  .screen-title { font-size: clamp(28px, 6vw, 42px); font-weight: 800; margin: 0; text-shadow: 0 4px 18px rgba(0,0,0,.4); }
  .char-panel { width: min(520px, 100%); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .char-row { display: flex; align-items: center; gap: 10px; }
  .char-name { flex: 1; text-align: center; }
  .char-name b { display: block; font-size: 30px; font-weight: 800; line-height: 1.1; }
  .char-name span { font-size: 15px; color: var(--muted); }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); transition: all .25s; }
  .dots i.on { width: 22px; background: var(--lemon); }
  .dots i.owned { background: rgba(255,255,255,.6); }
  .dots i.owned.on { background: var(--lemon); }
  .char-actions { display: flex; gap: 10px; }
  .char-actions .btn { flex: 1; }
  .price { direction: ltr; display: inline-flex; align-items: center; gap: 6px; }

  /* missions */
  .mlist { display: flex; flex-direction: column; gap: 8px; }
  .mission { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--glass-2); border: 1px solid var(--edge); }
  .mission .txt { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .mission .rw { direction: ltr; display: inline-flex; align-items: center; gap: 4px; font-weight: 800; color: var(--lemon); font-size: 15px; }
  .mission .rw svg { width: 18px; height: 18px; }
  .mission .bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .mission .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--leaf), #7be0a0); }
  .mission .num { grid-column: 1 / -1; font-size: 12px; color: var(--muted); direction: ltr; text-align: end; margin-top: -4px; font-variant-numeric: tabular-nums; }
  .mission.done { border-color: var(--lemon); box-shadow: 0 0 0 1px var(--lemon) inset; }
  .mlist.compact .mission { padding: 7px 10px; } .mlist.compact .txt { font-size: 14px; } .mlist.compact .num { display: none; }
  .sub { margin: 4px 0 0; font-size: 18px; font-weight: 800; color: var(--muted); }
  .life { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (max-width: 420px) { .life { grid-template-columns: repeat(2, 1fr); } }
  .life div { border-radius: 12px; background: var(--glass-2); border: 1px solid var(--edge); padding: 6px 8px; }
  .life b { display: block; font-size: 17px; font-weight: 800; direction: ltr; text-align: start; font-variant-numeric: tabular-nums; }
  .life span { font-size: 12px; color: var(--muted); }
  .perk { display: flex; width: fit-content; margin: 6px auto 0; align-items: center; gap: 6px; font-style: normal; font-size: 13px; font-weight: 700; color: #3a2a00; background: linear-gradient(180deg, var(--lemon-2), var(--lemon)); padding: 3px 10px; border-radius: 999px; }
  .perk:empty { display: none; }
  .perk svg { width: 14px; height: 14px; }
  #countdown { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-weight: 800; font-size: clamp(90px, 26vw, 180px); color: var(--lemon); text-shadow: 0 8px 0 rgba(0,0,0,.25), 0 14px 40px rgba(0,0,0,.45); direction: ltr; }
  #countdown.tick span { animation: cdPop .55s cubic-bezier(.2,.9,.3,1.3) both; display: inline-block; }
  @keyframes cdPop { from { transform: scale(1.8); opacity: 0; } 35% { transform: scale(1); opacity: 1; } to { transform: scale(.9); opacity: .15; } }

  /* cards */
  .card { width: min(440px, 100%); max-height: calc(100% - 20px); overflow-y: auto; border-radius: 30px; padding: 22px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .card h2 { margin: 0; text-align: center; font-size: 34px; font-weight: 800; }
  .card .btn { width: 100%; }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; background: var(--glass-2); border: 1px solid var(--edge); }
  .setting > span { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .setting > span svg { width: 22px; height: 22px; opacity: .85; }
  .setting .st { display: flex; flex-direction: column; line-height: 1.15; } .setting .st small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .seg { display: inline-flex; background: rgba(0,0,0,.3); border-radius: 12px; padding: 3px; gap: 2px; direction: inherit; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 15px; padding: 6px 12px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--lemon); color: #3a2a00; }
  .setting { flex-wrap: wrap; } .setting > .seg { flex-shrink: 1; min-width: 0; max-width: 100%; }
  @media (max-width: 520px) { .setting:has(> .seg) > .seg { flex: 1 1 100%; justify-content: space-between; } .setting:has(> .seg) > .seg button { flex: 1; padding: 6px 6px; } }
  .switch { width: 58px; height: 32px; border-radius: 99px; border: 0; background: rgba(255,255,255,.18); position: relative; cursor: pointer; transition: background .2s; flex: none; }
  .switch::after { content: ''; position: absolute; top: 4px; inset-inline-start: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .switch[aria-pressed="true"] { background: var(--leaf); }
  [dir="rtl"] .switch[aria-pressed="true"]::after { transform: translateX(-26px); }
  [dir="ltr"] .switch[aria-pressed="true"]::after { transform: translateX(26px); }

  /* game over */
  .ribbon { align-self: center; font-weight: 800; color: #3a2a00; background: linear-gradient(180deg, var(--lemon-2), var(--lemon-deep)); padding: 4px 18px; border-radius: 999px; font-size: 18px; box-shadow: 0 4px 0 var(--lemon-edge); animation: pop .7s ease-in-out infinite alternate; }
  @keyframes pop { to { transform: scale(1.08) rotate(-2deg); } }
  .score-big { text-align: center; }
  .score-big .lbl { font-size: 15px; color: var(--muted); font-weight: 600; }
  .score-big .val { font-size: 64px; font-weight: 800; line-height: 1; color: var(--lemon); font-variant-numeric: tabular-nums; direction: ltr; text-shadow: 0 6px 20px rgba(255, 200, 0, .3); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border-radius: 16px; background: var(--glass-2); border: 1px solid var(--edge); padding: 8px 6px; text-align: center; }
  .stat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; display: flex; justify-content: center; align-items: center; gap: 5px; }
  .stat .val svg { width: 18px; height: 18px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .btn { flex: 1; }
  /* secret code */
  .secret { display: flex; flex-direction: column; gap: 10px; }
  .btn.lemon { --bg: linear-gradient(180deg, #fff3a6, var(--lemon)); --edge-c: var(--lemon-edge); --fg: #3a2a00; font-size: 18px; min-height: 48px; }
  .code-form { display: flex; flex-direction: column; gap: 8px; background: var(--glass-2); border: 1px solid var(--edge); padding: 12px; border-radius: 18px; }
  .code-label { font-size: 15px; color: var(--muted); }
  .code-row { display: flex; gap: 8px; align-items: stretch; }
  .code-input { flex: 1; min-width: 0; font-family: inherit; font-size: 18px; color: var(--text); background: rgba(0,0,0,.35); border: 2px solid var(--edge); border-radius: 12px; padding: 8px 12px; outline: none; user-select: text; -webkit-user-select: text; }
  .code-input:focus-visible { border-color: var(--lemon); }
  .code-row .btn { width: auto; min-width: 96px; }
  .code-msg { margin: 0; min-height: 1.3em; font-size: 16px; font-weight: 700; }
  .code-msg.bad { color: #ff9a90; }
  .code-msg.good { color: var(--lemon); }
  .shake { animation: shake .35s ease; }
  @keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-8px) } 40% { transform: translateX(7px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }

  /* ---------------- HUD ---------------- */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: calc(10px + var(--safe-t)) 12px 0; direction: ltr; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .hud-score { display: flex; flex-direction: column; gap: 4px; }
  .score-pill { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 14px; border-radius: 20px; }
  .score-pill .val { font-size: clamp(26px, 6vw, 38px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .mult { font-weight: 800; font-size: 17px; color: #3a2a00; background: linear-gradient(180deg, var(--lemon-2), var(--lemon-deep)); padding: 2px 9px; border-radius: 10px; box-shadow: 0 3px 0 var(--lemon-edge); }
  .dist { font-size: 15px; font-weight: 700; color: #fff; opacity: .92; padding-left: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  .coin-pill { display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 8px; border-radius: 20px; font-size: clamp(22px, 5vw, 30px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .coin-pill svg { width: 30px; height: 30px; }
  #pauseBtn { pointer-events: auto; }
  /* PERF: no live backdrop blur over the moving 3D view during a run (it is
     re-blurred every frame and is very costly on phone GPUs) */
  #hud .glass, #hud .btn, #toast, #biomeName, #tutorial, .popup { backdrop-filter: none; -webkit-backdrop-filter: none; }
  #hud .glass, #biomeName, #tutorial { background: rgba(16, 20, 34, 0.72); }
  .hud-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .lemon-meter { display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px; border-radius: 16px; margin-inline-end: 54px; transition: box-shadow .3s; }
  .lemon-meter svg { width: 26px; height: 26px; }
  .lemon-meter .slots { display: flex; gap: 4px; }
  .lemon-meter .slots i { width: 11px; height: 17px; border-radius: 5px 5px 6px 6px; background: rgba(255,255,255,.16); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); transition: background .2s; }
  .lemon-meter .slots i.on { background: linear-gradient(180deg, #fff6b8, var(--lemon) 55%, var(--lemon-deep)); box-shadow: 0 0 8px rgba(255,225,74,.65), inset 0 -2px 0 rgba(160,110,0,.4); }
  .lemon-meter.rush { box-shadow: 0 0 0 2px var(--lemon), 0 0 22px rgba(255,225,74,.75); animation: lemonGlow .5s ease-in-out infinite alternate; }
  @keyframes lemonGlow { to { box-shadow: 0 0 0 2px var(--lemon), 0 0 34px rgba(255,225,74,.95); } }
  .popup.lemon { display: flex; align-items: center; gap: 4px; font-size: 26px; }
  .popup.lemon svg { width: 30px; height: 30px; }
  #powerbars { margin-top: 10px; display: flex; gap: 8px; }
  .pring { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(var(--c) calc(var(--p) * 1turn), rgba(255,255,255,.14) 0); box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: rise .35s both; }
  .pring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: rgba(16,20,32,.85); }
  .pring svg { position: relative; width: 28px; height: 28px; }
  .pring.low { animation: blink .4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  #toast { position: fixed; left: 50%; top: 24%; transform: translate(-50%, 0) scale(.8); font-weight: 800; font-size: clamp(26px, 6.5vw, 44px); color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.45); pointer-events: none; opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.2,.9,.3,1.4); white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -8px) scale(1); }
  #toast.gold { color: var(--lemon); }
  #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .popup { position: absolute; font-weight: 800; font-size: 22px; color: var(--lemon); text-shadow: 0 3px 10px rgba(0,0,0,.5); animation: floatUp .9s ease-out forwards; direction: ltr; white-space: nowrap; }
  @keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } 30% { transform: translate(-50%, -16px) scale(1.15); } to { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
  #biomeName { position: fixed; left: 50%; top: calc(88px + var(--safe-t)); transform: translate(-50%, -10px); font-weight: 800; font-size: 22px; padding: 6px 22px; border-radius: 999px; opacity: 0; transition: opacity .6s, transform .6s; pointer-events: none; white-space: nowrap; }
  #biomeName.show { opacity: 1; transform: translate(-50%, 0); }
  #fps { position: fixed; right: 10px; bottom: 8px; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; direction: ltr; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,60,40,0) 40%, rgba(255,40,30,.55)); opacity: 0; transition: opacity .4s; }
  #flash.on { opacity: 1; transition: opacity .05s; }

  /* tutorial */
  #tutorial { position: fixed; left: 50%; bottom: calc(40px + var(--safe-b)); transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-radius: 22px; font-size: 20px; font-weight: 700; pointer-events: none; transition: opacity .3s; white-space: nowrap; }
  #tutorial svg { width: 40px; height: 40px; }
  @media (max-height: 500px) {   /* landscape phones: keep the runner visible */
    #tutorial { bottom: auto; top: calc(62px + var(--safe-t)); font-size: 16px; padding: 7px 16px; gap: 10px; }
    #tutorial svg { width: 28px; height: 28px; }
  }
  #tutorial .keys { direction: ltr; font-size: 15px; color: var(--muted); }
  .swipe-hand { animation: swipeX 1.1s ease-in-out infinite; }
  .swipe-up { animation: swipeY 1.1s ease-in-out infinite; }
  .swipe-down { animation: swipeY 1.1s ease-in-out infinite reverse; }
  @keyframes swipeX { 0%,100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
  @keyframes swipeY { 0%,100% { transform: translateY(8px); } 50% { transform: translateY(-8px); } }

  [dir="ltr"] #charPrev svg, [dir="ltr"] #charNext svg { transform: scaleX(-1); }
  @media (max-width: 520px) {
    .btn.primary { font-size: 26px; padding: 14px 36px 16px; min-height: 62px; }
    .btn { font-size: 17px; }
    .btn.icon { width: 46px; min-width: 46px; height: 46px; min-height: 46px; }
    .pring { width: 46px; height: 46px; }
    .pring svg { width: 24px; height: 24px; }
    .card { padding: 18px; }
    .score-big .val { font-size: 52px; }
  }
  @media (max-height: 560px) {
    .logo-word { font-size: 56px; } .logo-lemon { width: 50px; }
    .tagline { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse, .logo-lemon, .ribbon, .swipe-hand, .swipe-up, .swipe-down { animation: none; } }
</style>

  <div class="card glass rise">
    <h2 data-i18n="settings">الإعدادات</h2>
    <div class="setting"><span><svg><use href="#i-sound"/></svg><b data-i18n="sfx">المؤثرات الصوتية</b></span><button class="switch" id="optSfx" aria-pressed="true" aria-label="Sound effects"></button></div>
    <div class="setting"><span><svg><use href="#i-music"/></svg><b data-i18n="music">الموسيقى</b></span><button class="switch" id="optMusic" aria-pressed="true" aria-label="Music"></button></div>
    <div class="setting"><span><svg><use href="#i-eye"/></svg><b data-i18n="graphics">الرسوميات</b></span>
      <div class="seg" id="optQuality"><button data-q="high" data-i18n="qHigh">عالية</button><button data-q="medium" data-i18n="qMed">متوسطة</button><button data-q="low" data-i18n="qLow">منخفضة</button></div></div>
    <div class="setting"><span><svg><use href="#i-gauge"/></svg><b data-i18n="fps">عرض FPS</b></span><button class="switch" id="optFps" aria-pressed="false" aria-label="FPS"></button></div>
    <div class="setting"><span><svg><use href="#i-gauge"/></svg><span class="st"><b data-i18n="drs">ثبات 60 فريم</b><small data-i18n="drsHint">يخفّف الدقة شوي وقت الضغط</small></span></span><button class="switch" id="optDrs" aria-pressed="false" aria-label="60 FPS"></button></div>
    <div class="setting"><span><svg><use href="#i-globe"/></svg><b data-i18n="language">اللغة</b></span>
      <div class="seg" id="optLang"><button data-l="ar">العربية</button><button data-l="en">English</button></div></div>
    <button class="btn green" id="settingsDone"><svg><use href="#i-check"/></svg><span data-i18n="done">تم</span></button>
  </div>
</section>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-score">
      <div class="score-pill glass"><span class="val" id="hudScore">0</span><span class="mult" id="hudMult">x1</span></div>
      <div class="dist" id="hudDist">0 m</div>
      <div id="powerbars"></div>
    </div>
    <div class="hud-side">
      <div class="hud-right">
        <div class="coin-pill glass"><svg><use href="#i-coin"/></svg><span id="hudCoins">0</span></div>
        <button class="btn icon" id="pauseBtn" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      </div>
      <div class="lemon-meter glass" id="lemonMeter" title="Lemonade"><svg viewBox="0 0 64 64"><use href="#i-lemon"/></svg><div class="slots"></div></div>
    </div>
  </div>
</div>
<div id="popups"></div>
<div id="toast" dir="auto"></div>
<div id="biomeName" class="glass"></div>
<div id="tutorial" class="glass" hidden></div>
<div id="fps" hidden></div>

<!-- PAUSE -->
<section id="pause" class="screen dim" hidden>
  <div class="card glass rise">
    <h2 data-i18n="paused">استراحة</h2>
    <button class="btn primary" id="resumeBtn"><svg><use href="#i-play"/></svg><span data-i18n="resume">متابعة</span></button>
    <div class="row2">
      <button class="btn" id="pauseSettings"><svg><use href="#i-gear"/></svg><span data-i18n="settings">الإعدادات</span></button>
      <button class="btn" id="pauseMenu"><svg><use href="#i-home"/></svg><span data-i18n="menu">القائمة</span></button>
    </div>
  </div>
</section>

<!-- GAME OVER -->
<!-- MISSIONS -->
<section id="missions" class="screen dim" hidden>
  <div class="card glass rise">
    <h2 data-i18n="missions">المهام</h2>
    <div class="mlist" id="missionList"></div>
    <h3 class="sub" data-i18n="lifetime">إحصائياتك</h3>
    <div class="life" id="lifeStats"></div>
    <button class="btn green" id="missionsDone"><svg><use href="#i-check"/></svg><span data-i18n="done">تم</span></button>
  </div>
</section>
<div id="countdown" hidden></div>

<section id="gameover" class="screen dim" hidden>
  <div class="card glass rise">
    <h2 data-i18n="gameOver">انتهت الجولة</h2>
    <div class="ribbon" id="newBest" hidden data-i18n="newBest">رقم قياسي جديد!</div>
    <div class="score-big"><div class="lbl" data-i18n="score">النتيجة</div><div class="val" id="goScore">0</div></div>
    <div class="stats">
      <div class="stat"><div class="lbl" data-i18n="distance">المسافة</div><div class="val" id="goDist">0 m</div></div>
      <div class="stat"><div class="lbl" data-i18n="coins">العملات</div><div class="val"><svg><use href="#i-coin"/></svg><span id="goCoins">0</span></div></div>
      <div class="stat"><div class="lbl" data-i18n="best">الأفضل</div><div class="val" id="goBest">0</div></div>
    </div>
    <div class="secret" dir="rtl" lang="ar">
      <button class="btn lemon" id="codeBtn" type="button">إدخال كود سري</button>
      <form id="codeForm" class="code-form" hidden autocomplete="off">
        <label for="codeInput" class="code-label">اكتب الكود السري لمتابعة الجولة</label>
        <div class="code-row">
          <input id="codeInput" class="code-input" type="text" dir="rtl" lang="ar" spellcheck="false" autocomplete="off" autocapitalize="off">
          <button class="btn lemon small" id="codeSubmit" type="submit">متابعة</button>
        </div>
        <p id="codeMsg" class="code-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
    <button class="btn primary" id="againBtn"><svg><use href="#i-retry"/></svg><span data-i18n="again">العب مجدداً</span></button>
    <button class="btn" id="goMenu"><svg><use href="#i-home"/></svg><span data-i18n="menu">القائمة</span></button>
    <div class="mlist compact" id="goMissions"></div>
  </div>
</section>
