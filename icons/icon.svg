    <ellipse cx="206" cy="276" rx="46" ry="52" fill="#fff" stroke="#161616" stroke-width="10"/>
    <ellipse cx="316" cy="270" rx="50" ry="56" fill="#fff" stroke="#161616" stroke-width="10"/>
    <ellipse cx="188" cy="280" rx="18" ry="21" fill="#161616"/>
    <ellipse cx="296" cy="274" rx="19" ry="22" fill="#161616"/>
    <circle cx="195" cy="270" r="6" fill="#fff"/><circle cx="303" cy="263" r="6.5" fill="#fff"/>
