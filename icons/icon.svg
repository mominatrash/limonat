    <path d="M318 132c28-50 88-66 124-48-14 44-66 78-124 48z" fill="url(#leaf)" stroke="#13552a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M326 128c34-14 64-28 104-40" stroke="#13552a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- lemon body -->
    <path d="M78 282c0-86 80-150 178-150s178 64 178 150c14 6 24 16 24 26s-10 20-24 22c-12 76-86 124-178 124S90 406 78 330c-14-2-24-12-24-22s10-20 24-26z" fill="url(#lem)" stroke="#8a5a00" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="170" cy="210" rx="52" ry="20" fill="#fff" opacity=".55" transform="rotate(-24 170 210)"/>
    <!-- the hero's beanie + tuft -->
    <path d="M150 170c14-60 70-92 124-90 56 2 100 34 110 88-66-26-168-26-234 2z" fill="#1b1b1d"/>
    <path d="M144 176c70-30 170-30 246-4" stroke="#2c2c30" stroke-width="16" fill="none" stroke-linecap="round"/>
    <ellipse cx="270" cy="80" rx="22" ry="16" fill="#1b1b1d"/>
    <path d="M268 70c8-34 40-56 78-58-8 18-24 30-40 38 16-2 30 2 42 10-26 10-52 14-80 10z" fill="#fafaf8" stroke="#161616" stroke-width="6" stroke-linejoin="round"/>
