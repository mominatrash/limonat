    <path d="M150 512L228 420M362 512L284 420" stroke="#08301f" stroke-width="12" stroke-linecap="round"/>
    <path d="M168 488H344M190 462H322M208 440H304" stroke="#08301f" stroke-width="9" stroke-linecap="round"/>
  </g>
