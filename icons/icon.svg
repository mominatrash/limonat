<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3cb878"/><stop offset=".55" stop-color="#1c7a4c"/><stop offset="1" stop-color="#0b3f2a"/>
    </radialGradient>
    <radialGradient id="lem" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fffbc4"/><stop offset=".35" stop-color="#ffe23b"/><stop offset=".8" stop-color="#f5b800"/><stop offset="1" stop-color="#d99200"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fd67f"/><stop offset="1" stop-color="#23873f"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#062a1b" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- sun rays -->
  <g opacity=".13" fill="#fff9c8" transform="translate(256 262)">
    <path d="M0 0L-40 -300L40 -300Z"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(30)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(60)"/>
    <path d="M0 0L-40 -300L40 -300Z" transform="rotate(90)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(120)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(150)"/>
    <path d="M0 0L-40 -300L40 -300Z" transform="rotate(180)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(210)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(240)"/>
    <path d="M0 0L-40 -300L40 -300Z" transform="rotate(270)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(300)"/><path d="M0 0L-40 -300L40 -300Z" transform="rotate(330)"/>
  </g>
  <!-- rails at the bottom -->
